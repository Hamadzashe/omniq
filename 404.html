<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Page not found | OMNIQ Integrated Systems</title>
    <link rel="icon" href="/assets/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #12141a;
        --mist: #eef0f2;
        --muted: #5c6370;
        --accent: #0d4f4f;
        --cyan: #00b4e6;
        --display: "Bricolage Grotesque", system-ui, sans-serif;
        --body: "Public Sans", system-ui, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: var(--body);
        color: var(--ink);
        background:
          radial-gradient(ellipse 70% 45% at 12% 18%, rgba(0, 180, 230, 0.14), transparent 55%),
          radial-gradient(ellipse 55% 40% at 90% 80%, rgba(13, 79, 79, 0.1), transparent 50%),
          linear-gradient(160deg, #f4f7fa, var(--mist) 45%, #e8eef3);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      .panel {
        width: min(34rem, 100%);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 1.5rem;
        box-shadow: 0 18px 50px rgba(18, 20, 26, 0.08);
        backdrop-filter: blur(14px);
        padding: 2rem 1.75rem 1.75rem;
        text-align: center;
      }

      .logo {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #0e1014;
        border-radius: 0.9rem;
        padding: 0.7rem 0.9rem;
        margin-bottom: 1.25rem;
      }

      .logo img {
        width: min(180px, 70vw);
        height: auto;
        display: block;
      }

      .code {
        font-family: var(--display);
        font-size: clamp(3.5rem, 12vw, 5rem);
        font-weight: 700;
        letter-spacing: -0.06em;
        line-height: 1;
        margin: 0 0 0.35rem;
        background: linear-gradient(135deg, var(--accent), var(--cyan));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      h1 {
        font-family: var(--display);
        font-size: clamp(1.35rem, 4vw, 1.7rem);
        letter-spacing: -0.03em;
        margin: 0 0 0.55rem;
      }

      p {
        margin: 0 auto 1.4rem;
        max-width: 28ch;
        color: var(--muted);
        line-height: 1.55;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        justify-content: center;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 2.75rem;
        padding: 0.7rem 1.15rem;
        border-radius: 0.75rem;
        font-weight: 600;
        text-decoration: none;
        transition: filter 0.15s ease, background 0.15s ease;
      }

      .btn-primary {
        background: linear-gradient(135deg, #00a8d5, #0077a8);
        color: #fff;
      }

      .btn-primary:hover {
        filter: brightness(1.05);
      }

      .btn-ghost {
        background: #fff;
        color: var(--ink);
        border: 1px solid rgba(18, 20, 26, 0.12);
      }

      .btn-ghost:hover {
        background: #f7f9fc;
      }
    </style>
  </head>
  <body>
    <main class="panel">
      <div class="logo">
        <img src="/assets/omniq-logo.png" alt="OMNIQ Integrated Systems" width="180" height="100" />
      </div>
      <p class="code" aria-hidden="true">404</p>
      <h1>This page could not be found</h1>
      <p>The link may be outdated, or the page may have moved.</p>
      <div class="actions">
        <a class="btn-primary" href="/">Return home</a>
        <a class="btn-ghost" href="/contact">Contact OMNIQ</a>
      </div>
    </main>
  </body>
</html>
