<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OMNIQ Admin</title>
    <link rel="icon" href="/admin/assets/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/admin/assets/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/admin/css/admin.css?v=20261110e" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@0.468.0"></script>
    <script src="/admin/js/config.js?v=20261110e"></script>
  </head>
  <body>
    <div id="login-view" class="login-body hidden">
      <div class="login-card">
        <div class="login-card__logo">
          <img
            src="/admin/assets/omniq-logo-clear.png"
            alt="OMNIQ Integrated Systems"
            width="160"
            height="90"
          />
        </div>
        <h1>OMNIQ Admin</h1>
        <p>Sign in with your @omniq.co.zw account.</p>
        <form id="login-form">
          <div class="field">
            <label for="login-email">Work email</label>
            <input
              id="login-email"
              name="email"
              type="email"
              autocomplete="username"
              required
              placeholder="you@omniq.co.zw"
            />
          </div>
          <div class="field">
            <label for="login-password">Password</label>
            <input
              id="login-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="btn btn--primary" type="submit" style="width: 100%">Sign in</button>
          <p class="auth-status" id="login-status" role="status"></p>
        </form>
      </div>
    </div>

    <div id="app-view" class="app-shell hidden">
      <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar__brand">
          <img
            class="sidebar__logo"
            src="/admin/assets/omniq-logo-clear.png"
            alt="OMNIQ Integrated Systems"
            width="160"
            height="90"
          />
          <span class="sidebar__tag">Admin console</span>
        </div>
        <nav class="nav" id="main-nav" aria-label="Admin">
          <button type="button" data-route="dashboard" class="is-active">
            <i data-lucide="layout-dashboard" aria-hidden="true"></i>
            <span>Dashboard</span>
          </button>
          <button type="button" data-route="clients">
            <i data-lucide="users" aria-hidden="true"></i>
            <span>Clients</span>
          </button>
          <button type="button" data-route="services">
            <i data-lucide="briefcase" aria-hidden="true"></i>
            <span>Services</span>
          </button>
          <button type="button" data-route="dpo">
            <i data-lucide="shield-check" aria-hidden="true"></i>
            <span>DPO</span>
          </button>
          <button type="button" data-route="billing">
            <i data-lucide="credit-card" aria-hidden="true"></i>
            <span>Billing</span>
          </button>
          <button type="button" data-route="finance">
            <i data-lucide="line-chart" aria-hidden="true"></i>
            <span>Finance</span>
          </button>
          <button type="button" data-route="receipts">
            <i data-lucide="receipt" aria-hidden="true"></i>
            <span>Receipts</span>
          </button>
        </nav>
        <div class="sidebar__user">
          <strong id="user-name">Director</strong>
          <span id="user-email"></span>
          <button class="btn btn--ghost btn--sm" id="logout-btn" type="button">
            <i data-lucide="log-out" aria-hidden="true"></i>
            Log out
          </button>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <button class="btn btn--ghost menu-toggle" id="menu-toggle" type="button" aria-label="Open menu">
            <i data-lucide="menu" aria-hidden="true"></i>
            <span>Menu</span>
          </button>
          <div class="search">
            <i data-lucide="search" class="search__icon" aria-hidden="true"></i>
            <input id="global-search" type="search" placeholder="Search clients, payments, DPO..." />
          </div>
          <div class="topbar__actions">
            <button class="btn btn--ghost btn--sm" id="alerts-btn" type="button" title="Due payments">
              <i data-lucide="bell" aria-hidden="true"></i>
              <span class="alerts-label">Alerts</span>
              <span class="badge hidden" id="alerts-badge">0</span>
            </button>
          </div>
        </header>
        <main class="content" id="page-root"></main>
      </div>
    </div>

    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <div id="receipt-print" aria-hidden="true"></div>

    <script src="/admin/js/app.js?v=20261110e" defer></script>
  </body>
</html>
